[build]
  publish = "."
  # build-cachebust stamps ?v=<hash> onto css/js so a deploy actually reaches
  # browsers that cached the previous version.
  command = "node build-manifest.js && node build-cachebust.js"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Every /api/* call goes to the single api function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Uploaded models/photos are served from Blobs, not the repo.
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/blob/:splat"
  status = 200

# Netlify defaults to max-age=0,must-revalidate, so every visit re-fetched the
# 660 KB viewer bundle and every model. These files only change on redeploy.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The manifest changes whenever models are added, so revalidate it.
[[headers]]
  for = "/models/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

# HTML pages carry the ?v= stamps that point at everything else, so they must
# never be served from cache — a stale copy keeps pointing at stale CSS/JS.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
